// ---------- S12: call to action (106 - 114) ----------
scene(106, 114, el => {
  const lock = h(`<div class="cta-lock">${ccTile(170)}<div class="wordmark" style="font-size:150px">CAPTION<span>.Ninja</span></div></div>`); el.appendChild(lock);
  const line = h(`<div class="cta-line">Start captioning in seconds.</div>`); el.appendChild(line);
  const urlB = h(`<div class="cta-url"></div>`); el.appendChild(urlB);
  const uc = makeCap('caption.ninja', { chars: true }); urlB.appendChild(uc.el);
  const chips = h(`<div class="cta-chips">${['Free', 'No install', 'No sign-up', 'Open source'].map(b => `<span class="chip">${ic('check', 28, 3)}${b}</span>`).join('')}</div>`); el.appendChild(chips);
  const foot = h(`<div class="cta-foot">From the maker of <b>VDO.Ninja</b> &nbsp;·&nbsp; Free support at <b>discord.vdo.ninja</b></div>`); el.appendChild(foot);
  const R = rng(5);
  const sparks = Array.from({ length: 30 }, () => { const s = h(`<i class="spark" style="top:325px"></i>`); s.style.background = ['#8CCBFF', '#fff', '#FFE14D', '#2498EB'][Math.floor(R() * 4)]; el.appendChild(s); const a = R() * 6.283; return { s, dx: Math.cos(a), dy: Math.sin(a) * .6, d: 240 + R() * 560, r: R() * 360, z: .5 + R() }; });
  sfx(105.8, 'slash', 1); sfx(106, 'impact', 1); sfx(107.25, 'type', .4); [...chips.children].forEach((c, i) => sfx(108 + i * .2, 'pop', .45));
  return (lt, t) => {
    const p = k(t, 106, .6, ease.outExpo);
    set(lock, { s: .8 + .2 * p, o: clamp01(p * 1.5) });
    for (const s of sparks) { const q = k(t, 106, 1.1, ease.outQuart); show(s.s, q < 1); set(s.s, { x: s.dx * s.d * q, y: s.dy * s.d * q, r: s.r + q * 200, s: s.z * (1 - q * .7), o: 1 - k(t, 106.5, .6) }); }
    const li = k(t, 106.7, .5); set(line, { y: (1 - li) * 24, o: li });
    const ui = k(t, 107.15, .45, ease.outBack); set(urlB, { s: .8 + .2 * ui, o: clamp01(ui * 1.4) });
    typeCap(uc, t, 107.25, .06, .25);
    [...chips.children].forEach((c, i) => { const q = k(t, 108 + i * .2, .4, ease.outBack); set(c, { s: .6 + .4 * q, y: (1 - q) * 16, o: clamp01(q * 1.5) }); });
    const fi = k(t, 108.9, .6); set(foot, { o: fi, y: (1 - fi) * 12 });
  };
});

} // buildAll

// =====================================================================
// clock
// =====================================================================
function render(t) {
  drawBg(t);
  for (const s of scenes) {
    const on = t >= s.start && t < s.end;
    if (on !== s.on) { s.el.style.display = on ? '' : 'none'; s.on = on; }
    if (on) s.update(t - s.start, t);
  }
  drawFx(t);
}

window.__fps = FPS;
window.__duration = DURATION;
window.__sfx = SFX;
window.__seek = t => render(t);
window.__ready = document.fonts.ready.then(() => { buildAll(); render(params.has('t') ? parseFloat(params.get('t')) : 0); return true; });

// ---------- player (skipped when rendering) ----------
if (RENDER) {
  document.body.classList.add('render');
} else {
  const view = document.getElementById('viewport'), audio = document.getElementById('music');
  const player = document.getElementById('player'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), time = document.getElementById('time'), mute = document.getElementById('mute'), big = document.getElementById('bigplay');
  const PLAY = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
  const PAUSE = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  const fit = () => {
    const vw = view.clientWidth, vh = view.clientHeight - 84, s = Math.min(vw / W, Math.max(vh, 100) / H);
    stage.style.transform = `translate(${((vw - W * s) / 2).toFixed(1)}px, ${Math.max(0, (vh - H * s) / 2).toFixed(1)}px) scale(${s.toFixed(5)})`;
  };
  addEventListener('resize', fit); fit();
  let playing = false, clock = 0, wall = 0, audioOk = true;
  audio.addEventListener('error', () => { audioOk = false; });
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => playing ? (audioOk && !audio.paused ? audio.currentTime : clock + (performance.now() - wall) / 1000) : clock;
  function setPlaying(p) {
    if (!p && playing) clock = now(); // read the position before `playing` flips, or now() returns the stale clock
    playing = p; pp.innerHTML = p ? PAUSE : PLAY; pp.setAttribute('aria-label', p ? 'Pause' : 'Play'); big.hidden = true;
    if (p) { if (clock >= DURATION - .05) clock = 0; wall = performance.now(); if (audioOk) { audio.currentTime = clock; audio.play().catch(() => { audioOk = false; }); } }
    else audio.pause();
  }
  pp.onclick = () => setPlaying(!playing);
  big.onclick = () => { clock = 0; setPlaying(true); };
  const muteIcon = () => { mute.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[audio.muted ? 'volume-x' : 'volume-2']}</svg>`; mute.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute'); };
  mute.onclick = () => { audio.muted = !audio.muted; muteIcon(); };
  scrub.oninput = () => { clock = parseFloat(scrub.value); wall = performance.now(); if (audioOk) audio.currentTime = clock; render(clock); };
  addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });
  window.__ready.then(() => {
    player.hidden = false; big.hidden = false; pp.innerHTML = PLAY; muteIcon();
    // show the logo frame as a poster, but keep the transport at the start so any Play control begins at 0:00
    clock = params.has('t') ? parseFloat(params.get('t')) : 0; render(params.has('t') ? clock : 13.4);
    scrub.value = clock; time.textContent = `${fmt(clock)} / ${fmt(DURATION)}`;
    (function loop() {
      if (playing) { let t = now(); if (t >= DURATION) { t = DURATION; clock = DURATION; setPlaying(false); } render(t); scrub.value = t; time.textContent = `${fmt(t)} / ${fmt(DURATION)}`; }
      requestAnimationFrame(loop);
    })();
  });
}
</script>
