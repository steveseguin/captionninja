<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264" role="img" aria-labelledby="title desc">
<title id="title">Two ways to control captions</title><desc id="desc">Streamer.bot uses &amp;streamerbot=8080. The VDO.Ninja plugin uses &amp;api=YOUR_KEY. Choose one.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="640" height="264" rx="14" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" fill="#172b45" font-size="20" font-weight="bold">Choose the app that controls your button</text><rect x="20" y="48" width="253" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/><g transform="translate(34 65)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="37" height="24" rx="6"/><path d="M19 2v7 M12 25h14"/><circle cx="11" cy="18" r="2"/><circle cx="28" cy="18" r="2"/></g><text x="83" y="77" fill="#172b45" font-size="18" font-weight="bold">Streamer.bot</text><text x="83" y="102" fill="#172b45" font-size="15" font-weight="normal">&amp;streamerbot=8080</text><path d="M284 86 L342 86" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="354" y="48" width="266" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/><g transform="translate(369 63)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="1" width="13" height="22" rx="6"/><path d="M6 17v2a12.5 12.5 0 0 0 25 0v-2 M18.5 32v6 M11 38h15"/></g><text x="416" y="78" fill="#172b45" font-size="18" font-weight="bold">Caption.Ninja</text><text x="416" y="102" fill="#172b45" font-size="15" font-weight="normal">Starts / stops listening</text><rect x="20" y="140" width="253" height="76" rx="12" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(34 157)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="36" height="30" rx="5"/><rect x="6" y="7" width="5" height="5" rx="1"/><rect x="6" y="19" width="5" height="5" rx="1"/><rect x="16" y="7" width="5" height="5" rx="1"/><rect x="16" y="19" width="5" height="5" rx="1"/><rect x="26" y="7" width="5" height="5" rx="1"/><rect x="26" y="19" width="5" height="5" rx="1"/></g><text x="83" y="169" fill="#172b45" font-size="18" font-weight="bold">VDO.Ninja plugin</text><text x="83" y="194" fill="#172b45" font-size="15" font-weight="normal">&amp;api=YOUR_KEY</text><path d="M284 178 L342 178" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="354" y="140" width="266" height="76" rx="12" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(369 155)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="1" width="13" height="22" rx="6"/><path d="M6 17v2a12.5 12.5 0 0 0 25 0v-2 M18.5 32v6 M11 38h15"/></g><text x="416" y="170" fill="#172b45" font-size="18" font-weight="bold">Caption.Ninja</text><text x="416" y="194" fill="#172b45" font-size="15" font-weight="normal">Starts / stops listening</text><text x="22" y="243" fill="#172b45" font-size="15" font-weight="normal">Pick one route. Both control the same microphone capture.</text></g></svg>