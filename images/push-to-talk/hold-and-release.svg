<svg xmlns="http://www.w3.org/2000/svg" width="640" height="236" viewBox="0 0 640 236" role="img" aria-labelledby="title desc">
<title id="title">Hold to listen, release to pause</title><desc id="desc">Holding the button starts capture. Releasing stops capture. Final words already spoken may finish appearing after release.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="640" height="236" rx="14" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" fill="#172b45" font-size="20" font-weight="bold">What your button does</text><rect x="20" y="48" width="290" height="140" rx="12" fill="#f0fdf4" stroke="#86efac"/><rect x="330" y="48" width="290" height="140" rx="12" fill="#fff1f2" stroke="#fda4af"/><g transform="translate(38 67)" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="1" width="13" height="22" rx="6"/><path d="M6 17v2a12.5 12.5 0 0 0 25 0v-2 M18.5 32v6 M11 38h15"/></g><text x="91" y="91" fill="#166534" font-size="24" font-weight="bold">HOLD</text><text x="38" y="132" fill="#172b45" font-size="18" font-weight="bold">Microphone listens</text><text x="38" y="160" fill="#172b45" font-size="16" font-weight="normal">Your words become captions</text><g transform="translate(348 67)" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="7" height="27" rx="2"/><rect x="24" y="4" width="7" height="27" rx="2"/></g><text x="401" y="91" fill="#9f1239" font-size="24" font-weight="bold">RELEASE</text><text x="348" y="132" fill="#172b45" font-size="17" font-weight="bold">Microphone stops listening</text><text x="348" y="160" fill="#172b45" font-size="16" font-weight="normal">New speech is not captured</text><text x="22" y="216" fill="#172b45" font-size="15" font-weight="normal">The last words you already spoke may appear a moment later.</text></g></svg>