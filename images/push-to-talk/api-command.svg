<svg xmlns="http://www.w3.org/2000/svg" width="640" height="217" viewBox="0 0 640 217" role="img" aria-labelledby="title desc">
<title id="title">API microphone command flow</title><desc id="desc">A button or script sends a mic command with the private API key. Caption.Ninja starts with true and stops with false.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="640" height="217" rx="14" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" fill="#172b45" font-size="20" font-weight="bold">Send a microphone command</text><rect x="20" y="49" width="166" height="117" rx="12" fill="#eff6ff" stroke="#93c5fd"/><g transform="translate(35 63)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="37" height="29" rx="4"/><path d="M1 11h37 M7 6h1 M13 6h1 M8 19h20 M8 25h14"/></g><text x="35" y="124" fill="#172b45" font-size="17" font-weight="bold">Button or script</text><text x="35" y="149" fill="#172b45" font-size="15" font-weight="normal">Send start / stop</text><rect x="237" y="49" width="166" height="117" rx="12" fill="#eff6ff" stroke="#93c5fd"/><g transform="translate(252 63)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="11" r="8"/><path d="M16 17l18 18 M27 28l5-5 M22 23l5-5"/></g><text x="252" y="124" fill="#172b45" font-size="17" font-weight="bold">Private API key</text><text x="252" y="149" fill="#172b45" font-size="15" font-weight="normal">Matches your tab</text><rect x="454" y="49" width="166" height="117" rx="12" fill="#eff6ff" stroke="#93c5fd"/><g transform="translate(469 63)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="1" width="13" height="22" rx="6"/><path d="M6 17v2a12.5 12.5 0 0 0 25 0v-2 M18.5 32v6 M11 38h15"/></g><text x="469" y="124" fill="#172b45" font-size="17" font-weight="bold">Caption.Ninja</text><text x="469" y="149" fill="#172b45" font-size="15" font-weight="normal">Listens / pauses</text><path d="M195 104 L227 104" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M412 104 L444 104" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="22" y="197" fill="#172b45" font-size="16" font-weight="bold">Press: mic / true</text><text x="330" y="197" fill="#172b45" font-size="16" font-weight="bold">Release: mic / false</text></g></svg>