<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264" role="img" aria-labelledby="title desc">
<title id="title">Streamer.bot press and release actions</title><desc id="desc">Press runs start captions and OBS unmute. Release runs pause captions and OBS mute. Configure both actions as shown in the guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="640" height="264" rx="14" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" fill="#172b45" font-size="20" font-weight="bold">One Streamer.bot button can control both</text><rect x="20" y="49" width="151" height="75" rx="12" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(33 69)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="36" height="30" rx="5"/><rect x="6" y="7" width="5" height="5" rx="1"/><rect x="6" y="19" width="5" height="5" rx="1"/><rect x="16" y="7" width="5" height="5" rx="1"/><rect x="16" y="19" width="5" height="5" rx="1"/><rect x="26" y="7" width="5" height="5" rx="1"/><rect x="26" y="19" width="5" height="5" rx="1"/></g><text x="79" y="92" fill="#172b45" font-size="16" font-weight="bold">PRESS</text><path d="M180 86 L226 86" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="237" y="49" width="167" height="75" rx="12" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(249 67)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="37" height="24" rx="6"/><path d="M19 2v7 M12 25h14"/><circle cx="11" cy="18" r="2"/><circle cx="28" cy="18" r="2"/></g><text x="297" y="81" fill="#172b45" font-size="15" font-weight="normal">Run the</text><text x="297" y="104" fill="#172b45" font-size="17" font-weight="bold">action</text><path d="M414 86 L449 86" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="461" y="49" width="159" height="75" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="475" y="79" fill="#172b45" font-size="16" font-weight="bold">Start captions</text><text x="475" y="104" fill="#172b45" font-size="15" font-weight="normal">Unmute OBS mic</text><rect x="20" y="142" width="151" height="75" rx="12" fill="#fff1f2" stroke="#fda4af"/><g transform="translate(33 162)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="36" height="30" rx="5"/><rect x="6" y="7" width="5" height="5" rx="1"/><rect x="6" y="19" width="5" height="5" rx="1"/><rect x="16" y="7" width="5" height="5" rx="1"/><rect x="16" y="19" width="5" height="5" rx="1"/><rect x="26" y="7" width="5" height="5" rx="1"/><rect x="26" y="19" width="5" height="5" rx="1"/></g><text x="79" y="185" fill="#172b45" font-size="16" font-weight="bold">RELEASE</text><path d="M180 179 L226 179" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="237" y="142" width="167" height="75" rx="12" fill="#fff1f2" stroke="#fda4af"/><g transform="translate(249 160)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="37" height="24" rx="6"/><path d="M19 2v7 M12 25h14"/><circle cx="11" cy="18" r="2"/><circle cx="28" cy="18" r="2"/></g><text x="297" y="174" fill="#172b45" font-size="15" font-weight="normal">Run the</text><text x="297" y="197" fill="#172b45" font-size="17" font-weight="bold">action</text><path d="M414 179 L449 179" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="461" y="142" width="159" height="75" rx="12" fill="#fff1f2" stroke="#fda4af"/><text x="475" y="172" fill="#172b45" font-size="16" font-weight="bold">Pause captions</text><text x="475" y="197" fill="#172b45" font-size="15" font-weight="normal">Mute OBS mic</text><text x="22" y="243" fill="#172b45" font-size="14" font-weight="normal">Add both the caption command and the OBS mute action in the steps below.</text></g></svg>