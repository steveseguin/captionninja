<svg xmlns="http://www.w3.org/2000/svg" width="640" height="253" viewBox="0 0 640 253" role="img" aria-labelledby="title desc">
<title id="title">The listening link and the display link</title><desc id="desc">Open the listening link in Chrome or Edge. Put the overlay link in OBS. Match the room names; only the listening link needs the API key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="640" height="253" rx="14" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="22" y="31" fill="#172b45" font-size="20" font-weight="bold">Two links, two different jobs</text><rect x="20" y="48" width="290" height="157" rx="12" fill="#eff6ff" stroke="#93c5fd"/><rect x="330" y="48" width="290" height="157" rx="12" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(37 64)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="37" height="29" rx="4"/><path d="M1 11h37 M7 6h1 M13 6h1 M8 19h20 M8 25h14"/></g><text x="87" y="87" fill="#172b45" font-size="20" font-weight="bold">Browser tab</text><text x="38" y="125" fill="#172b45" font-size="16" font-weight="bold">LISTENS to your microphone</text><text x="38" y="153" fill="#172b45" font-size="16" font-weight="normal">room=YOUR_ROOM</text><text x="38" y="181" fill="#172b45" font-size="15" font-weight="normal">+ your chosen control option</text><g transform="translate(347 64)" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="37" height="27" rx="3"/><path d="M19 28v7 M11 35h16"/><rect x="7" y="18" width="25" height="5" rx="1"/></g><text x="397" y="87" fill="#172b45" font-size="18" font-weight="bold">OBS Browser Source</text><text x="348" y="125" fill="#172b45" font-size="16" font-weight="bold">SHOWS captions to viewers</text><text x="348" y="153" fill="#172b45" font-size="16" font-weight="normal">room=YOUR_ROOM</text><text x="348" y="181" fill="#172b45" font-size="15" font-weight="normal">+ translate=en (optional)</text><text x="22" y="232" fill="#172b45" font-size="15" font-weight="normal">Use the same room name. Keep your private key out of the OBS link.</text></g></svg>